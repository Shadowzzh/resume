<div class="resume-shell">
  <header class="resume-header">
    <div class="header-top">
      <div class="name-area">
        <h1 class="header-name">{{name}}</h1>
      </div>
      <span class="job-title">{{jobTitle}}</span>
    </div>
    <div class="header-summary">
      {{summary}}
    </div>
    <div class="contact-info">
      {{contactStrip}}
    </div>
  </header>

  <section>
    <div class="section-title-v5">专业技能</div>
    <div class="tech-list-v5">
      {{skillRows}}
    </div>
  </section>

  <section>
    <div class="section-title-v5">工作经历</div>
    <div class="experience-list-v5">
      {{experienceList}}
    </div>
  </section>

  <section class="project-section-v5">
    <div class="section-title-v5">核心项目经历</div>
    <div class="project-list-v5">
      {{projectCards}}
    </div>
  </section>

  {{personalProjectSection}}
</div>
