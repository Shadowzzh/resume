domains:
- id: frontend
  name: 前端开发
  level: strong
  keywords:
  - JavaScript / TypeScript
  - Vue 2 / Vue 3
  - React / Next.js
  - Node.js
  narrative: 长期使用 JavaScript / TypeScript，熟练掌握 Vue 2 / Vue 3、React 与 Next.js，具备丰富的项目实践，可承担企业级中后台、复杂状态与实时交互，以及
    Node.js 配套服务开发。
- id: engineering
  name: 前端工程化
  level: strong
  keywords:
  - Vite / Webpack
  - Monorepo
  - 组件库
  - 单元测试
  narrative: 具备 Vite / Webpack 项目的构建与升级经验，能够建设和维护 Monorepo、组件库、自动化测试及多环境和离线构建流程。
- id: ai-agent
  name: AI Agent 应用
  level: strong
  keywords:
  - Pi / Claude Code / Codex
  - Claude Agent SDK / MCP
  - Playwright / CDP
  - 移动端自动化（adb / Mobilewright）
  narrative: 以 Pi 生态为主力，重度使用 Claude Code、Codex 等 Coding AI 驱动日常开发与运维。
- id: backend
  name: 服务端与工具
  level: working
  keywords:
  - Go
  - Java / Spring Boot
  narrative: 具备 Go 跨平台检测工具开发与发布经验，可参与 Java / Spring Boot 既有项目维护、接口开发和跨端联调。
- id: delivery
  name: 部署与交付
  level: working
  keywords:
  - Docker
  - Nginx
  - Linux / Shell
  narrative: 具备 Docker 容器化、Nginx 配置与 Linux / Shell 实践，熟悉常见网络与部署方案，能够独立完成服务部署、版本发布、日志诊断和故障排查，对软硬件设备有一定动手经验。
